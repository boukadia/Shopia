services:

    # NestJS Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopia_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopia_user}:${POSTGRES_PASSWORD:-shopia_password}@postgres:5432/${POSTGRES_DB:-shopia_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopia_network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: shopia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopia_password}
      POSTGRES_DB: ${POSTGRES_DB:-shopia_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopia_user} -d ${POSTGRES_DB:-shopia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - PostgreSQL Web Interface
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shopia_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shopia.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - shopia_network

volumes:
  postgres_data:

networks:
  shopia_network:
    driver: bridge